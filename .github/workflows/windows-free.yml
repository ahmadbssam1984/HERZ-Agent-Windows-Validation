name: HERZ Windows acceptance (free standard runner)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: herz-windows-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Refuse private or nonstandard billing scope
        shell: pwsh
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:REPOSITORY_PRIVATE -ne 'false') { throw 'This reviewed workflow is for a PUBLIC repository and standard runner only.' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and extract reviewed public source
        shell: pwsh
        run: |
          $expected = '0daa4b694de01ae7daa291e4640bd3681055bad1b9ab6e3ce41d510950827c79'
          $actual = (Get-FileHash -LiteralPath .\public-source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Reviewed source SHA256 mismatch.' }
          Expand-Archive -LiteralPath .\public-source.zip -DestinationPath . -Force
      - name: Prepare verified portable dependencies
        shell: pwsh
        run: python ci/prepare_windows.py
      - name: Unit and integration checks on bundled Python
        shell: pwsh
        run: |
          & .\runtime\python.exe -I -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual startup and recovery as a standard user
        shell: pwsh
        run: .\ci\windows-standard-user.ps1 -PackageRoot $PWD.Path -OutputDirectory (Join-Path $PWD 'ci-results')
      - name: Install free browser test driver in CI only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test dashboard and lesson player in Edge
        shell: pwsh
        run: |
          python tests/browser_app_check.py --app-python runtime/python.exe --browser-channel msedge --output ci-results/browser-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/browser_lesson_check.py --app-python runtime/python.exe --browser-channel msedge --output ci-results/browser-lesson
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify 500 MiB chunked upload and conversion
        shell: pwsh
        run: |
          python tests/large_pipeline_check.py --app-python runtime/python.exe --size-mib 500 --report ci-results/large-pipeline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report sanitized acceptance evidence
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path .\ci-results -Filter *.json -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName }
          Get-ChildItem -Path .\ci-results -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 120 }
# No paid runner labels, artifact upload, cache, deployment, secrets, or student data.
